name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  # Every pull request, whatever its base, so stacked PRs each get checks.
  pull_request:

env:
  NODE_ENV: test
  JWT_SECRET: test-secret-key-for-ci
  JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci

jobs:
  # Code Quality Checks
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: false

    - name: Run Prettier check
      run: npm run format:check
      continue-on-error: false

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run npm audit fix (dry run)
      run: npm audit fix --dry-run
      continue-on-error: true

    - name: Check for secrets with GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  # Automated Testing
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      # --forceExit: the Redis client keeps the process alive after the last test.
      run: npm run test:coverage -- --runInBand --forceExit
      env:
        NODE_ENV: test
        MONGODB_TEST_URI: mongodb://localhost:27017/cstore-test
        REDIS_ENABLED: 'true'
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
        JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-0123456789

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.node-version == '20.x'
      with:
        files: ./coverage/lcov.info
        flags: unittests

  # Build Docker Images
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Development Image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: development
        push: false
        tags: cryptons:dev
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Production Image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: production
        push: false
        tags: cryptons:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/cryptons-image.tar

